<!DOCTYPE html>
<html>
<head>
    <title>Seznam prihlasek</title>   
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class={{ theme }}>
    {% include 'theme_button.html' %}
    <div class="container">
    <h1>Seznam prihlasek</h1>
    {% for server, channels in channel_info_grouped.items() %}
        <details open>
            <summary class="server-heading">{{ server }}</summary>
            <ul>
                {% for info in channels %}
                    <li class="message"><a href="/prihlaska?channel_id={{ info.channel_id }}">{{ info.channel }}</a></li>
                {% endfor %}
            </ul>
        </details>
    {% endfor %}
    </div>
</body>
</html>
